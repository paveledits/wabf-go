name: ctf-room-probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Recover archived Applied Digital Skills client
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, re, urllib.error, urllib.parse, urllib.request

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          ORIGIN = "https://applieddigitalskills.withgoogle.com"
          paths = ["/", "/login", "/dashboard", "/student", "/teacher", "/s/en/learn"]

          def fetch(url, timeout=35, limit=3000000):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.geturl(), dict(r.headers), r.read(limit)
              except urllib.error.HTTPError as e:
                  return e.code, e.geturl(), dict(e.headers), e.read(limit)
              except Exception as e:
                  return None, url, {}, repr(e).encode()

          print("=== SNAPSHOT LOOKUP ===", flush=True)
          snapshots = []
          for path in paths:
              original = ORIGIN + path
              api = "https://archive.org/wayback/available?" + urllib.parse.urlencode({"url": original, "timestamp": "20240601"})
              status, final, headers, body = fetch(api)
              print(path, status, body.decode("utf-8", "replace")[:4000], flush=True)
              try:
                  data = json.loads(body)
                  snap = data.get("archived_snapshots", {}).get("closest", {})
                  if snap.get("available"):
                      snapshots.append((path, snap["timestamp"], snap["url"]))
              except Exception:
                  pass

          print("=== ARCHIVED HTML AND SCRIPTS ===", flush=True)
          scripts = []
          for path, ts, snap_url in snapshots:
              original = ORIGIN + path
              replay = f"https://web.archive.org/web/{ts}id_/{original}"
              status, final, headers, body = fetch(replay)
              text = body.decode("utf-8", "replace")
              print("PAGE", path, ts, status, final, headers.get("Content-Type"), len(body), flush=True)
              print(text[:20000], flush=True)
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I):
                  if src.startswith("//"):
                      src = "https:" + src
                  elif src.startswith("/"):
                      src = ORIGIN + src
                  elif not src.startswith("http"):
                      src = urllib.parse.urljoin(original, src)
                  scripts.append((ts, src))

          seen = set()
          scripts = [(ts, src) for ts, src in scripts if not (src in seen or seen.add(src))]
          print("SCRIPTS", json.dumps(scripts, indent=2), flush=True)

          keywords = re.compile(r'.{0,180}(?:class.?code|join.?class|enrollment|course|student.?progress|/api/|fetch\(|axios|graphql|dashboard|classroom).{0,300}', re.I)

          def get_script(item):
              ts, src = item
              replay = f"https://web.archive.org/web/{ts}id_/{src}"
              return item, fetch(replay, 50, 8000000)

          print("=== SCRIPT ENDPOINT STRINGS ===", flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for (ts, src), result in ex.map(get_script, scripts[:80]):
                  status, final, headers, body = result
                  text = body.decode("utf-8", "replace")
                  matches = keywords.findall(text)
                  urls = sorted(set(re.findall(r'https?://[^"\'\s)]+|/[A-Za-z0-9_./?=&%-]*(?:api|class|course|student|join|dashboard)[A-Za-z0-9_./?=&%-]*', text, re.I)))
                  if matches or urls:
                      print("SCRIPT", ts, src, status, headers.get("Content-Type"), len(body), flush=True)
                      print("MATCHES", json.dumps(matches[:80], ensure_ascii=False), flush=True)
                      print("URLS", json.dumps(urls[:300], ensure_ascii=False), flush=True)

          print("=== DOMAIN JS CDX ===", flush=True)
          cdx_urls = [
              "https://web.archive.org/cdx/search/cdx?" + urllib.parse.urlencode({
                  "url": "applieddigitalskills.withgoogle.com/*.js",
                  "from": "2023",
                  "to": "2025",
                  "output": "json",
                  "fl": "timestamp,original,statuscode,mimetype,length",
                  "filter": ["statuscode:200", "mimetype:application/javascript|text/javascript"],
                  "collapse": "urlkey",
                  "limit": "2000",
              }),
              "https://web.archive.org/cdx/search/cdx?" + urllib.parse.urlencode({
                  "url": "applieddigitalskills.withgoogle.com/static/*",
                  "from": "2023",
                  "to": "2025",
                  "output": "json",
                  "fl": "timestamp,original,statuscode,mimetype,length",
                  "filter": "statuscode:200",
                  "collapse": "urlkey",
                  "limit": "2000",
              }),
          ]
          for url in cdx_urls:
              status, final, headers, body = fetch(url, 90, 10000000)
              print("CDX", status, body.decode("utf-8", "replace")[:200000], flush=True)
          PY
