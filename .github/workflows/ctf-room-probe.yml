name: ctf-room-probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe room code and archives
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, html, json, re, urllib.error, urllib.parse, urllib.request

          CODE = "c2xbypl"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"

          candidates = [
              f"https://classroom.google.com/c/?cjc={CODE}",
              f"https://classroom.google.com/u/0/h?cjc={CODE}",
              f"https://applieddigitalskills.withgoogle.com/?code={CODE}",
              f"https://applieddigitalskills.withgoogle.com/apps/route?code={CODE}",
              f"https://applieddigitalskills.withgoogle.com/apps/join?code={CODE}",
              f"https://edu.exceedlms.com/student/catalog?search={CODE}",
              f"https://padlet.com/join/{CODE}",
              f"https://wakelet.com/wake/{CODE}",
              f"https://w2g.tv/rooms/{CODE}",
              f"https://watch2gether.com/rooms/{CODE}",
              f"https://sync-tube.de/room/{CODE}",
              f"https://cytu.be/r/{CODE}",
              f"https://kosmi.io/room/{CODE}",
              f"https://watchparty.me/watch/{CODE}",
              f"https://whereby.com/{CODE}",
              f"https://discord.com/api/v10/invites/{CODE}?with_counts=true&with_expiration=true",
          ]

          def fetch(url, timeout=15):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, r.geturl(), dict(r.headers), r.read(150000)
              except urllib.error.HTTPError as e:
                  return e.code, e.geturl(), dict(e.headers), e.read(150000)
              except Exception as e:
                  return None, url, {}, repr(e).encode()

          def summary(body):
              s = body.decode("utf-8", "replace")
              title = re.search(r"<title[^>]*>(.*?)</title>", s, re.I | re.S)
              og = re.search(r'<meta[^>]+(?:property|name)=["\']og:title["\'][^>]+content=["\']([^"\']+)', s, re.I)
              text = re.sub(r"<script.*?</script>|<style.*?</style>", " ", s, flags=re.I | re.S)
              text = html.unescape(re.sub(r"<[^>]+>", " ", text))
              return {
                  "title": html.unescape(title.group(1)).strip() if title else None,
                  "og_title": html.unescape(og.group(1)).strip() if og else None,
                  "text": re.sub(r"\s+", " ", text).strip()[:900],
              }

          def probe(url):
              status, final, headers, body = fetch(url)
              return {"requested": url, "status": status, "final": final, "type": headers.get("Content-Type"), "len": len(body), **summary(body)}

          print("=== LIVE ===", flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              for result in ex.map(probe, candidates):
                  print(json.dumps(result, ensure_ascii=False), flush=True)

          print("=== WAYBACK AVAILABILITY ===", flush=True)
          availability = ["https://archive.org/wayback/available?" + urllib.parse.urlencode({"url": u}) for u in candidates]
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              for original, result in zip(candidates, ex.map(fetch, availability)):
                  status, final, headers, body = result
                  print(original, status, body.decode("utf-8", "replace")[:1800], flush=True)

          print("=== CDX ===", flush=True)
          targets = [
              f"classroom.google.com/*{CODE}*",
              f"applieddigitalskills.withgoogle.com/*{CODE}*",
              f"padlet.com/*{CODE}*",
              f"wakelet.com/*{CODE}*",
              f"w2g.tv/*{CODE}*",
              f"watch2gether.com/*{CODE}*",
          ]
          cdx = ["https://web.archive.org/cdx/search/cdx?" + urllib.parse.urlencode({"url": t, "output": "json", "fl": "timestamp,original,statuscode,mimetype", "filter": "statuscode:200", "collapse": "urlkey", "limit": "50"}) for t in targets]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              for target, result in zip(targets, ex.map(fetch, cdx)):
                  status, final, headers, body = result
                  print(target, status, body.decode("utf-8", "replace")[:8000], flush=True)

          print("=== SEARCH ===", flush=True)
          queries = [f'"{CODE}"', f'"{CODE}" vlog', '"does ppl still watch vlogs"', '"i have a room to share my vlogs sometimes"']
          search_urls = []
          for q in queries:
              search_urls.extend([
                  "https://www.bing.com/search?q=" + urllib.parse.quote(q),
                  "https://html.duckduckgo.com/html/?q=" + urllib.parse.quote(q),
              ])
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for url, result in zip(search_urls, ex.map(fetch, search_urls)):
                  status, final, headers, body = result
                  print(url, status, json.dumps(summary(body), ensure_ascii=False), flush=True)
          PY
