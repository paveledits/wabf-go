name: ctf-room-probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe room code and archives
        shell: bash
        run: |
          python3 - <<'PY'
          import html, json, re, urllib.error, urllib.parse, urllib.request

          CODE = "c2xbypl"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"

          urls = [
              f"https://classroom.google.com/c/?cjc={CODE}",
              f"https://classroom.google.com/u/0/h?cjc={CODE}",
              f"https://applieddigitalskills.withgoogle.com/?code={CODE}",
              f"https://applieddigitalskills.withgoogle.com/apps/route?code={CODE}",
              f"https://applieddigitalskills.withgoogle.com/apps/join?code={CODE}",
              f"https://edu.exceedlms.com/student/catalog?search={CODE}",
              f"https://padlet.com/join/{CODE}",
              f"https://wakelet.com/wake/{CODE}",
              f"https://w2g.tv/rooms/{CODE}",
              f"https://watch2gether.com/rooms/{CODE}",
              f"https://sync-tube.de/room/{CODE}",
              f"https://cytu.be/r/{CODE}",
              f"https://kosmi.io/room/{CODE}",
              f"https://watchparty.me/watch/{CODE}",
              f"https://whereby.com/{CODE}",
              f"https://meet.jit.si/{CODE}",
              f"https://discord.com/api/v10/invites/{CODE}?with_counts=true&with_expiration=true",
          ]

          def fetch(url, timeout=25):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      body = r.read(200000)
                      return r.status, r.geturl(), dict(r.headers), body
              except urllib.error.HTTPError as e:
                  return e.code, e.geturl(), dict(e.headers), e.read(200000)
              except Exception as e:
                  return None, url, {}, repr(e).encode()

          def clean_text(body):
              s = body.decode("utf-8", "replace")
              title = re.search(r"<title[^>]*>(.*?)</title>", s, re.I | re.S)
              og = re.search(r'<meta[^>]+(?:property|name)=["\']og:title["\'][^>]+content=["\']([^"\']+)', s, re.I)
              desc = re.search(r'<meta[^>]+(?:property|name)=["\'](?:og:description|description)["\'][^>]+content=["\']([^"\']+)', s, re.I)
              text = re.sub(r"<script.*?</script>|<style.*?</style>", " ", s, flags=re.I | re.S)
              text = html.unescape(re.sub(r"<[^>]+>", " ", text))
              text = re.sub(r"\s+", " ", text).strip()
              return {
                  "title": html.unescape(title.group(1)).strip() if title else None,
                  "og_title": html.unescape(og.group(1)).strip() if og else None,
                  "description": html.unescape(desc.group(1)).strip() if desc else None,
                  "text": text[:1200],
              }

          print("=== LIVE URL PROBES ===")
          for url in urls:
              status, final, headers, body = fetch(url)
              print(json.dumps({
                  "requested": url,
                  "status": status,
                  "final": final,
                  "content_type": headers.get("Content-Type"),
                  "location": headers.get("Location"),
                  "body_len": len(body),
                  **clean_text(body),
              }, ensure_ascii=False))

          print("=== WAYBACK AVAILABILITY ===")
          for url in urls:
              api = "https://archive.org/wayback/available?" + urllib.parse.urlencode({"url": url})
              status, final, headers, body = fetch(api, 40)
              print(url, status, body.decode("utf-8", "replace")[:2000])

          print("=== WAYBACK CDX ===")
          cdx_targets = [
              f"flipgrid.com/{CODE}*",
              f"www.flipgrid.com/{CODE}*",
              f"flip.com/{CODE}*",
              f"www.flip.com/{CODE}*",
              f"classroom.google.com/*{CODE}*",
              f"applieddigitalskills.withgoogle.com/*{CODE}*",
              f"padlet.com/*{CODE}*",
              f"wakelet.com/*{CODE}*",
              f"w2g.tv/*{CODE}*",
              f"watch2gether.com/*{CODE}*",
          ]
          for target in cdx_targets:
              api = "https://web.archive.org/cdx/search/cdx?" + urllib.parse.urlencode({
                  "url": target,
                  "output": "json",
                  "fl": "timestamp,original,statuscode,mimetype,digest,length",
                  "filter": "statuscode:200",
                  "collapse": "urlkey",
                  "limit": "100",
              })
              status, final, headers, body = fetch(api, 80)
              print(target, status, body.decode("utf-8", "replace")[:15000])

          print("=== COMMON CRAWL ===")
          cc_targets = [
              f"flipgrid.com/{CODE}",
              f"flip.com/{CODE}",
              f"classroom.google.com/*{CODE}*",
              f"applieddigitalskills.withgoogle.com/*{CODE}*",
              f"padlet.com/*{CODE}*",
              f"wakelet.com/*{CODE}*",
          ]
          for target in cc_targets:
              api = "https://index.commoncrawl.org/CC-MAIN-2026-26-index?" + urllib.parse.urlencode({"url": target, "output": "json"})
              status, final, headers, body = fetch(api, 80)
              print(target, status, body.decode("utf-8", "replace")[:15000])

          print("=== SEARCH ENGINE HTML ===")
          queries = [
              f'"{CODE}"',
              f'"{CODE}" vlog',
              '"does ppl still watch vlogs"',
              '"i have a room to share my vlogs sometimes"',
          ]
          for q in queries:
              for engine in [
                  "https://www.google.com/search?q=" + urllib.parse.quote(q),
                  "https://www.bing.com/search?q=" + urllib.parse.quote(q),
                  "https://html.duckduckgo.com/html/?q=" + urllib.parse.quote(q),
              ]:
                  status, final, headers, body = fetch(engine, 40)
                  print(q, engine, status, clean_text(body))
          PY
