name: ctf-room-probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe correct Google class-code request
        shell: bash
        run: |
          pip install -q requests
          python3 - <<'PY' > result.txt 2>&1
          import json, os, re, urllib.parse
          import requests

          CODE = "c2xbypl"
          REQUEST = json.dumps([None, CODE, None, 1], separators=(",", ":"))
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          ARCHIVED_JS = "https://web.archive.org/web/20220808132001id_/https://applieddigitalskills.withgoogle.com/static/js/gcip_login.js"
          s = requests.Session()
          s.headers.update({"User-Agent": UA, "Accept": "*/*"})

          js = s.get(ARCHIVED_JS, timeout=60)
          print("ARCHIVED_JS", js.status_code, js.url, js.headers.get("content-type"), len(js.content), flush=True)
          open("gcip_login.js", "wb").write(js.content)
          print("REQUEST_JSON", REQUEST, flush=True)
          print("REQUEST_ENCODED", urllib.parse.quote(REQUEST, safe=""), flush=True)

          hosts = [
              "https://applieddigitalskills.withgoogle.com",
              "https://csfirst.withgoogle.com",
              "https://apski-production.appspot.com",
              "https://apski-production-dot-appspot.com",
              "https://apski-production.firebaseapp.com",
              "https://apski-production.web.app",
              "https://apski.appspot.com",
              "https://applieddigitalskills.appspot.com",
              "https://applied-digital-skills.appspot.com",
              "https://engedu-elms-lms.appspot.com",
              "https://elms-lms.appspot.com",
              "https://engedu.appspot.com",
          ]
          params_list = [
              {"request": REQUEST},
              {"$req": REQUEST},
              {"req": REQUEST},
          ]
          paths = [
              "/v1/course/validate-join",
              "/api/v1/course/validate-join",
              "/_ah/api/v1/course/validate-join",
          ]

          print("=== LIVE CORRECT REQUEST ===", flush=True)
          for host in hosts:
              for path in paths:
                  for params in params_list:
                      try:
                          r = s.get(host + path, params=params, allow_redirects=False, timeout=20)
                          print(json.dumps({
                              "url": r.request.url,
                              "status": r.status_code,
                              "location": r.headers.get("location"),
                              "server": r.headers.get("server"),
                              "content_type": r.headers.get("content-type"),
                              "len": len(r.content),
                              "body_hex": r.content[:160].hex(),
                              "body": r.text[:2000],
                          }, ensure_ascii=False), flush=True)
                      except Exception as e:
                          print("ERROR", host, path, params, repr(e), flush=True)

          exact_urls = []
          for domain in ["applieddigitalskills.withgoogle.com", "csfirst.withgoogle.com", "apski-production.appspot.com"]:
              for key in ["request", "$req", "req"]:
                  exact_urls.append("https://" + domain + "/v1/course/validate-join?" + urllib.parse.urlencode({key: REQUEST}))
              exact_urls += [
                  f"https://{domain}/login/{CODE}",
                  f"https://{domain}/login-student?course_code={CODE}",
              ]

          print("=== WAYBACK EXACT ===", flush=True)
          for target in exact_urls:
              try:
                  r = s.get("https://archive.org/wayback/available", params={"url": target}, timeout=45)
                  print("AVAILABLE", target, r.status_code, r.text[:5000], flush=True)
              except Exception as e:
                  print("AVAILABLE_ERROR", target, repr(e), flush=True)

          print("=== WAYBACK ENDPOINT CDX ===", flush=True)
          cdx_targets = [
              "applieddigitalskills.withgoogle.com/v1/course/validate-join*",
              "csfirst.withgoogle.com/v1/course/validate-join*",
              "apski-production.appspot.com/v1/course/validate-join*",
              f"applieddigitalskills.withgoogle.com/*{CODE}*",
              f"csfirst.withgoogle.com/*{CODE}*",
              f"apski-production.appspot.com/*{CODE}*",
          ]
          for target in cdx_targets:
              try:
                  r = s.get("https://web.archive.org/cdx/search/cdx", params={
                      "url": target,
                      "output": "json",
                      "fl": "timestamp,original,statuscode,mimetype,length,digest",
                      "filter": "statuscode:200",
                      "collapse": "urlkey",
                      "limit": "10000",
                  }, timeout=90)
                  print("CDX", target, r.status_code, r.url, r.text[:250000], flush=True)
              except Exception as e:
                  print("CDX_ERROR", target, repr(e), flush=True)

          print("=== WAYBACK REPLAY EXACT ===", flush=True)
          for target in exact_urls[:9]:
              for timestamp in ["20220701", "20230101", "20240101", "20240601", "20250101"]:
                  replay = f"https://web.archive.org/web/{timestamp}id_/{target}"
                  try:
                      r = s.get(replay, allow_redirects=False, timeout=45)
                      print(json.dumps({
                          "target": target,
                          "timestamp": timestamp,
                          "status": r.status_code,
                          "location": r.headers.get("location"),
                          "type": r.headers.get("content-type"),
                          "len": len(r.content),
                          "body": r.text[:3000],
                      }, ensure_ascii=False), flush=True)
                  except Exception as e:
                      print("REPLAY_ERROR", target, timestamp, repr(e), flush=True)

          print("=== FIREBASE PROJECT TESTS ===", flush=True)
          api_key = "AIzaSyDF-3pZUvJoMwesJta9rM7EAUf0ZfnlU5k"
          firebase_urls = [
              f"https://identitytoolkit.googleapis.com/v1/projects?key={api_key}",
              f"https://identitytoolkit.googleapis.com/v1/accounts:signUp?key={api_key}",
              "https://firestore.googleapis.com/v1/projects/apski-production/databases/(default)/documents",
              "https://apski-production.firebaseio.com/.json",
          ]
          for url in firebase_urls:
              try:
                  if "accounts:signUp" in url:
                      r = s.post(url, json={"returnSecureToken": True}, timeout=30)
                  else:
                      r = s.get(url, timeout=30)
                  print("FIREBASE", url, r.status_code, r.headers.get("content-type"), r.text[:10000], flush=True)
              except Exception as e:
                  print("FIREBASE_ERROR", url, repr(e), flush=True)
          PY
          cat result.txt
      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: ctf-room-correct-probe
          path: |
            result.txt
            gcip_login.js
          retention-days: 1
