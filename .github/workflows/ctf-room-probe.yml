name: ctf-room-probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover archived Google education bundles
        shell: bash
        run: |
          pip install -q requests
          python3 - <<'PY' > result.txt 2>&1
          import concurrent.futures, hashlib, json, os, re, urllib.parse
          from pathlib import Path
          import requests

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Accept": "*/*"})
          outdir = Path("bundles")
          outdir.mkdir(exist_ok=True)

          def get(url, timeout=60, max_bytes=12_000_000):
              try:
                  r = S.get(url, timeout=timeout)
                  return r.status_code, r.url, dict(r.headers), r.content[:max_bytes]
              except Exception as e:
                  return None, url, {}, repr(e).encode()

          domains = ["applieddigitalskills.withgoogle.com", "csfirst.withgoogle.com"]
          all_rows = []
          for domain in domains:
              params = [
                  ("url", f"{domain}/static/js/*"),
                  ("output", "json"),
                  ("fl", "timestamp,original,statuscode,mimetype,length,digest"),
                  ("filter", "statuscode:200"),
                  ("collapse", "urlkey"),
                  ("limit", "10000"),
              ]
              url = "https://web.archive.org/cdx/search/cdx?" + urllib.parse.urlencode(params)
              st, final, hdr, body = get(url, 120, 30_000_000)
              print("CDX", domain, st, final, hdr.get("content-type"), len(body), flush=True)
              text = body.decode("utf-8", "replace")
              print(text[:10000], flush=True)
              try:
                  data = json.loads(text)
                  if data and isinstance(data[0], list):
                      keys = data[0]
                      all_rows.extend(dict(zip(keys, row)) for row in data[1:])
              except Exception as e:
                  print("PARSE_ERROR", domain, repr(e), flush=True)

          Path("cdx_rows.json").write_text(json.dumps(all_rows, ensure_ascii=False, indent=2))
          print("ROW_COUNT", len(all_rows), flush=True)

          selected = {}
          for row in all_rows:
              original = row.get("original", "")
              base = original.split("?",1)[0]
              if not base.endswith(".js"):
                  continue
              name = base.rsplit("/",1)[-1]
              key = (urllib.parse.urlsplit(original).netloc, name)
              old = selected.get(key)
              if old is None or row.get("timestamp", "") > old.get("timestamp", ""):
                  selected[key] = row

          print("SELECTED", len(selected), flush=True)
          for key,row in sorted(selected.items()):
              print(key, row, flush=True)

          priority_words = ["dashboard","course","class","student","teacher","project","lesson","unit","activity","common","profile","login","home","app"]
          ordered = []
          for key,row in selected.items():
              name = key[1].lower()
              score = sum(5 for w in priority_words if w in name)
              try:length=int(row.get("length") or 0)
              except:length=0
              ordered.append((-score, length, key, row))
          ordered.sort()
          ordered = ordered[:180]

          def download(item):
              _,_,key,row = item
              ts = row["timestamp"]
              original = row["original"]
              replay = f"https://web.archive.org/web/{ts}id_/{original}"
              st,final,hdr,body = get(replay, 70, 15_000_000)
              return key,row,replay,st,final,hdr,body

          manifest=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for key,row,replay,st,final,hdr,body in ex.map(download, ordered):
                  domain,name=key
                  safe = re.sub(r"[^A-Za-z0-9_.-]", "_", domain+"__"+name)
                  digest=hashlib.sha1(row["original"].encode()).hexdigest()[:8]
                  path=outdir/(digest+"__"+safe)
                  if st==200 and body and not body.startswith(b"ConnectionError"):
                      path.write_bytes(body)
                  manifest.append({"domain":domain,"name":name,"row":row,"replay":replay,"status":st,"final":final,"content_type":hdr.get("content-type"),"downloaded":len(body),"file":str(path) if path.exists() else None})
                  print("DOWNLOAD", manifest[-1], flush=True)
          Path("manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2))

          needle_re = re.compile(rb".{0,300}(?:v1/course|validate-join|class.?code|videos watched|student.?progress|lesson|assignment|unit|video|course_student_code|create-student-account).{0,500}", re.I|re.S)
          endpoint_re = re.compile(rb"(?:https?://[^\"'\s)]+|/[A-Za-z0-9_./?=&%${}:~-]{3,})")
          findings=[]
          for p in outdir.iterdir():
              data=p.read_bytes()
              contexts=[]
              for m in needle_re.finditer(data):
                  contexts.append(m.group(0).decode("utf-8","replace"))
                  if len(contexts)>=100:break
              endpoints=sorted({m.decode("utf-8","replace") for m in endpoint_re.findall(data) if any(w in m.lower() for w in [b"course",b"class",b"lesson",b"video",b"student",b"unit",b"progress",b"api"])})
              if contexts or endpoints:
                  findings.append({"file":str(p),"contexts":contexts,"endpoints":endpoints[:1000]})
          Path("findings.json").write_text(json.dumps(findings, ensure_ascii=False, indent=2))
          print("FINDING_FILES", len(findings), flush=True)
          for f in findings:
              print("FINDING", f["file"], flush=True)
              print(json.dumps(f, ensure_ascii=False)[:60000], flush=True)
          PY
          tar -czf archived-google-bundles.tar.gz bundles cdx_rows.json manifest.json findings.json result.txt
      - name: Upload archived bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archived-google-education-bundles
          path: archived-google-bundles.tar.gz
          if-no-files-found: warn
          retention-days: 1
