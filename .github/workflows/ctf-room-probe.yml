name: ctf-room-probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reverse join endpoint and test class code
        shell: bash
        run: |
          pip install -q jsbeautifier requests
          python3 - <<'PY'
          import json, re, requests, jsbeautifier, urllib.parse

          CODE = "c2xbypl"
          TS = "20220808132001"
          ORIGINAL = "https://applieddigitalskills.withgoogle.com/static/js/gcip_login.js"
          ARCHIVED = f"https://web.archive.org/web/{TS}id_/{ORIGINAL}"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"

          s = requests.Session()
          s.headers.update({"User-Agent": UA, "Accept": "*/*"})
          r = s.get(ARCHIVED, timeout=60)
          print("SCRIPT", r.status_code, r.url, r.headers.get("content-type"), len(r.content), flush=True)
          source = r.text
          pretty = jsbeautifier.beautify(source)

          needles = [
              "/v1/course/validate-join",
              "Enter your class code",
              "Class Code Entry",
              "course_student_code",
              "/create-student-account",
          ]
          for needle in needles:
              print("=== NEEDLE", needle, "===", flush=True)
              start = 0
              count = 0
              while True:
                  idx = pretty.find(needle, start)
                  if idx < 0 or count >= 12:
                      break
                  print("INDEX", idx, flush=True)
                  print(pretty[max(0, idx-5000):idx+7000], flush=True)
                  start = idx + len(needle)
                  count += 1

          endpoint = "/v1/course/validate-join"
          idx = pretty.find(endpoint)
          if idx >= 0:
              chunk = pretty[max(0, idx-15000):idx+15000]
              print("=== LARGE VALIDATE CHUNK ===", flush=True)
              print(chunk, flush=True)

          base = "https://applieddigitalskills.withgoogle.com"
          candidates = []
          payloads = [
              {"course_code": CODE},
              {"courseCode": CODE},
              {"code": CODE},
              {"student_code": CODE},
              {"course_student_code": CODE},
          ]
          for payload in payloads:
              candidates.append(("GET", base + endpoint, payload, None))
              candidates.append(("POST_JSON", base + endpoint, None, payload))
              candidates.append(("POST_FORM", base + endpoint, None, payload))
          candidates += [
              ("GET", base + "/login-student", {"course_code": CODE}, None),
              ("GET", base + "/login-student", {"code": CODE}, None),
              ("GET", base + "/login/" + CODE, None, None),
              ("GET", base + "/course/" + CODE, None, None),
          ]

          print("=== LIVE ENDPOINT TESTS ===", flush=True)
          for kind, url, params, payload in candidates:
              try:
                  if kind == "GET":
                      resp = s.get(url, params=params, allow_redirects=False, timeout=25)
                  elif kind == "POST_JSON":
                      resp = s.post(url, json=payload, allow_redirects=False, timeout=25)
                  else:
                      resp = s.post(url, data=payload, allow_redirects=False, timeout=25)
                  print(json.dumps({
                      "kind": kind,
                      "url": resp.request.url,
                      "payload": payload,
                      "status": resp.status_code,
                      "location": resp.headers.get("location"),
                      "content_type": resp.headers.get("content-type"),
                      "length": len(resp.content),
                      "body": resp.text[:3000],
                  }, ensure_ascii=False), flush=True)
              except Exception as e:
                  print("ERROR", kind, url, payload, repr(e), flush=True)

          print("=== WAYBACK ENDPOINT INDEX ===", flush=True)
          cdx_params = {
              "url": "applieddigitalskills.withgoogle.com/v1/course/validate-join*",
              "output": "json",
              "fl": "timestamp,original,statuscode,mimetype,length,digest",
              "filter": "statuscode:200",
              "collapse": "digest",
              "limit": "1000",
          }
          try:
              resp = s.get("https://web.archive.org/cdx/search/cdx", params=cdx_params, timeout=90)
              print(resp.status_code, resp.url, resp.text[:100000], flush=True)
          except Exception as e:
              print("CDX ERROR", repr(e), flush=True)
          PY
