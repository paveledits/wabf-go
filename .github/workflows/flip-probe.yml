name: l3ak-public-api-probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch public RCTF API
        shell: bash
        run: |
          python3 - <<'PY' > l3ak-api.txt 2>&1
          import concurrent.futures, json, requests
          BASE="https://ctf.l3ak.team"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          paths=[
            "/api/v1/challs", "/api/v2/challs",
            "/api/v1/integrations/client/config", "/api/v2/integrations/client/config",
            "/api/v1/leaderboard/now", "/api/v2/leaderboard/now", "/api/v2/leaderboard/challs",
            "/api/v1/leaderboard/graph", "/api/v2/leaderboard/graph",
          ]
          def get(path):
            try:
              r=requests.get(BASE+path,headers={"User-Agent":UA,"Accept":"application/json"},allow_redirects=False,timeout=20)
              return {"path":path,"status":r.status_code,"headers":dict(r.headers),"body":r.text}
            except Exception as e:return {"path":path,"error":repr(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
            for x in ex.map(get,paths): print(json.dumps(x,ensure_ascii=False),flush=True)
          PY
          cat l3ak-api.txt
      - name: Upload API output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3ak-public-api
          path: l3ak-api.txt
          retention-days: 1
